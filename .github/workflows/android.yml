name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint e build
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Prova la release minificata su un emulatore vero, con i dati live di Roma Mobilità
  # (scarica il GTFS da 50 MB: per questo non gira a ogni push).
  emulator:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Release firmata con una chiave usa e getta
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke -keyalg RSA -validity 1 \
            -storepass smokepass -keypass smokepass -dname "CN=smoke"
          KEYSTORE_FILE="$RUNNER_TEMP/smoke.jks" KEYSTORE_PASSWORD=smokepass KEY_ALIAS=smoke KEY_PASSWORD=smokepass \
            ./gradlew assembleRelease

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/smoke.py app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screenshots
          path: shots/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      # Richiede i secret RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      - name: Release firmata
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Secret di firma mancanti"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "rome_rtgtfs-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: rome_rtgtfs-*.apk
